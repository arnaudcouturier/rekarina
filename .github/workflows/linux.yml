name: Linux checks

# What can run without game files: the content guard, the platform audit, the platform layer's tests and the installer's
# unit tests. The container is Fedora because Ubuntu's runner image has no SDL3 headers (runtime/platform/linux.c).
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - run: dnf install -y git clang lld python3 python3-pip SDL3-devel make
      - uses: actions/checkout@v4
      - run: python3 tools/check_content.py
      - run: python3 tools/check_platform.py
      - name: Platform layer: driver-backed memory
        run: |
          mkdir -p build
          clang -O1 tests/mem_backed_check.c runtime/platform/linux.c runtime/platform/common.c -Iruntime/platform \
              $(pkg-config --cflags --libs sdl3) -lpthread -ldl -o build/mem_backed_check
          build/mem_backed_check
      - name: Installer unit tests
        run: |
          pip install -r tools/requirements-installer.txt
          python3 -m unittest discover -s tests -p "installer_test.py"
