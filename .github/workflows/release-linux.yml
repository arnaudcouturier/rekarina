name: Linux packaging check

# Builds the Linux setup (the folder, the tar.gz and the AppImage) by hand: run it from the Actions tab. It needs
# the pinned downloads of tools/make_release_linux.py, the .NET 10 SDK and about 60 GB; a runner without them stops at
# the first step. Nothing derived from a game is in the result (tools/check_content.py runs over the folder).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - run: dnf install -y git clang lld python3 python3-pip SDL3-devel make meson nasm pkgconf-pkg-config dotnet-sdk-10.0 libstdc++-static tar xz
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv && .venv/bin/pip install -r tools/requirements.txt
      - run: sh tools/fetch_refs.sh
      - run: .venv/bin/python tools/make_release_linux.py --oot --out build/release/Rekarina-toolchain-linux
      - run: .venv/bin/python tools/make_rekarina_release.py --from build/release/Rekarina-toolchain-linux --out build/release/Rekarina-Setup-linux --appimage build/release/Rekarina-x86_64.AppImage
      - run: sh tools/pack_linux_release.sh build/release/Rekarina-Setup-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rekarina-linux
          path: |
            build/release/*.tar.gz
            build/release/*.AppImage
            build/release/SHA256SUMS
